<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Ruta · Impacta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--azul:#0E4DA4;--celeste:#35A8E0;--ambar:#F2A33C;--verde:#1D8A4E;--verde-bg:#E6F5EC;
--fondo:#EEF3F9;--tinta:#1B2028;--gris:#69707C;--card:#fff;--borde:#DDE4EE}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--fondo);color:var(--tinta);padding-bottom:16px}
h1{font-weight:700}

#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--azul),var(--celeste));z-index:100;display:flex;flex-direction:column;padding:28px 22px;overflow-y:auto}
#login .marca{color:#BFE3F7;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-top:20px}
#login h1{color:#fff;font-size:26px;margin:14px 0 4px}
#login p{color:#D7EBFA;font-size:14.5px;margin-bottom:24px;line-height:1.5}
.vend-btn{background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:15px 18px;color:#fff;font-size:16px;font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:inherit;margin-bottom:10px;width:100%}
.vend-btn:active{background:rgba(255,255,255,.25)}
.vend-btn small{display:block;font-weight:400;font-size:12px;color:#CFE8F9;margin-top:2px}

header{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;padding:11px 15px 0}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hd-top .vnom{font-size:15.5px;font-weight:700;flex:1;line-height:1.1}
.hd-top .vnom small{display:block;font-weight:400;font-size:11px;color:#BFE3F7}
.cambiar{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;font-family:inherit}
.tabs-fr{display:flex}
.tabs-fr button{flex:1;background:none;border:none;color:#BFE3F7;font-size:13px;font-weight:600;padding:9px 0;border-bottom:3px solid transparent;font-family:inherit}
.tabs-fr button.on{color:#fff;border-color:var(--ambar)}

.dias-scroll{display:flex;gap:7px;overflow-x:auto;padding:11px 15px 8px;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:10}
.dias-scroll::-webkit-scrollbar{display:none}
.dia-btn{white-space:nowrap;border:1.5px solid var(--borde);background:#fff;border-radius:100px;padding:8px 15px;font-size:14px;font-weight:600;color:var(--gris);cursor:pointer;font-family:inherit;flex-shrink:0}
.dia-btn.on{background:var(--azul);border-color:var(--azul);color:#fff}
.dia-btn .pend{display:inline-block;background:var(--ambar);color:#4a3200;border-radius:100px;font-size:11px;padding:0 6px;margin-left:5px;font-weight:700}
.dia-btn.on .pend{background:#fff;color:var(--azul)}

#map{height:230px;margin:0;border-bottom:3px solid var(--azul);z-index:1}
.barra-dia{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:9}
.barra-dia .info{font-size:12.5px;color:var(--gris)}
.barra-dia .info b{color:var(--azul);font-size:15px}
.barra-dia .prog{font-size:12.5px;color:var(--gris)}
.barra-dia .prog b{color:var(--verde)}

main{padding:8px 13px}
.parada{background:var(--card);border:1.5px solid var(--borde);border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.parada.hecho{background:var(--verde-bg);border-color:#B6E0C5}
.num-p{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.parada.hecho .num-p{background:var(--verde)}
.p-info{flex:1;min-width:0}
.p-nom{font-size:15px;font-weight:600;line-height:1.25}
.parada.hecho .p-nom{text-decoration:line-through;color:var(--gris)}
.p-dist{font-size:12px;color:var(--gris);margin-top:2px}
.p-acc{display:flex;gap:8px;flex-shrink:0}
.p-acc a,.p-acc button{border:none;border-radius:10px;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.ir{background:var(--azul);color:#fff}
.hh{background:#eceff3;color:var(--gris)}
.parada.hecho .hh{background:var(--verde);color:#fff}
.vacio{text-align:center;color:var(--gris);padding:48px 20px;font-size:14.5px;line-height:1.6}
.leaf-num{background:var(--azul);color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaf-num.hecho{background:var(--verde)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tinta);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;z-index:200;transition:transform .25s;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

  est.vend=v; cargar();
  const mios=C.filter(c=>c[iV]===v);
  const freqs=[...new Set(mios.map(c=>c[iFR]))];
  est.freq=freqs.includes('Q1')?'Q1':freqs[0];
  const dias=DIAS.filter(d=>mios.some(c=>c[iFR]===est.freq&&c[iD]===d));
  est.dia=dias[0];
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('vnom').innerHTML=v+'<small>sede '+sede(v)+'</small>';
  tabs(freqs);
  if(!map){map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO'}).addTo(map);capa=L.featureGroup().addTo(map);}
  setTimeout(()=>map.invalidateSize(),120);
  render();
}
function sede(v){if(v.indexOf('Valle')>=0)return'Garagoa';if(v.indexOf('V1')===0||v.indexOf('Sogamoso')===0)return'Sogamoso';if(v.indexOf('Duitama')>=0||/V2|V3|Cercanos/.test(v))return'Duitama';return'Tunja';}
function tabs(freqs){const c=document.getElementById('tabs-fr');const ord=['Q1','Q2','SS'].filter(f=>freqs.includes(f));
 if(ord.length<2){c.style.display='none';return;}c.style.display='flex';
 c.innerHTML=ord.map(f=>'<button data-f="'+f+'" class="'+(f===est.freq?'on':'')+'">'+FREQS[f]+'</button>').join('');
 c.querySelectorAll('button').forEach(b=>b.onclick=()=>{est.freq=b.dataset.f;
   const ds=DIAS.filter(d=>C.some(c=>c[iV]===est.vend&&c[iFR]===est.freq&&c[iD]===d));est.dia=ds[0];render();});}
document.getElementById('btn-cambiar').onclick=()=>{document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';};

function delDia(){return C.filter(c=>c[iV]===est.vend&&c[iFR]===est.freq&&c[iD]===est.dia).sort((a,b)=>a[iSEQ]-b[iSEQ]);}

function render(){
  const mios=C.filter(c=>c[iV]===est.vend&&c[iFR]===est.freq);
  const dias=DIAS.filter(d=>mios.some(c=>c[iD]===d));
  const dc=document.getElementById('dias');
  dc.innerHTML=dias.map(d=>{
    const arr=mios.filter(c=>c[iD]===d);const pend=arr.filter(c=>!est.hechos.has(cid(c))).length;
    return '<button class="dia-btn '+(d===est.dia?'on':'')+'" data-d="'+d+'">'+d+(pend?'<span class="pend">'+pend+'</span>':' ✓')+'</button>';
  }).join('');
  dc.querySelectorAll('.dia-btn').forEach(b=>b.onclick=()=>{est.dia=b.dataset.d;render();scrollTo(0,0);});

  const arr=delDia();
  // distancia total del día
  let dist=0;for(let i=0;i<arr.length-1;i++){if(arr[i][iLAT]&&arr[i+1][iLAT])dist+=hav([arr[i][iLAT],arr[i][iLON]],[arr[i+1][iLAT],arr[i+1][iLON]]);}
  const hechos=arr.filter(c=>est.hechos.has(cid(c))).length;
  document.getElementById('bd-info').innerHTML='<b>'+arr.length+'</b> paradas · '+distTxt(dist)+' de recorrido';
  document.getElementById('bd-prog').innerHTML='<b>'+hechos+'</b> / '+arr.length+' visitados';

  // mapa
  capa.clearLayers();const pts=[];
  arr.forEach((c,i)=>{if(c[iLAT]==null)return;const ll=[c[iLAT],c[iLON]];pts.push(ll);
    const hecho=est.hechos.has(cid(c));
    L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="leaf-num'+(hecho?' hecho':'')+'">'+c[iSEQ]+'</div>',iconSize:[22,22],iconAnchor:[11,11]})})
     .bindPopup('<b>'+c[iSEQ]+'. '+c[iN]+'</b>').addTo(capa);});
  if(pts.length){L.polyline(pts,{color:'#0E4DA4',weight:3,opacity:.55,dashArray:'5 5'}).addTo(capa);
    setTimeout(()=>{map.invalidateSize();map.fitBounds(capa.getBounds().pad(0.12));},80);}

  // lista
  const cont=document.getElementById('lista');
  if(!arr.length){cont.innerHTML='<div class="vacio">No hay paradas este día.</div>';return;}
  let html='';
  arr.forEach((c,i)=>{
    const hecho=est.hechos.has(cid(c));
    let dnext='';
    if(i<arr.length-1&&c[iLAT]&&arr[i+1][iLAT])dnext='↳ '+distTxt(hav([c[iLAT],c[iLON]],[arr[i+1][iLAT],arr[i+1][iLON]]))+' a la siguiente';
    const maps=c[iLAT]!=null?'https://www.google.com/maps/dir/?api=1&destination='+c[iLAT]+','+c[iLON]+'&travelmode=driving':'';
    html+='<div class="parada'+(hecho?' hecho':'')+'" data-id="'+cid(c)+'">'+
      '<div class="num-p">'+c[iSEQ]+'</div>'+
      '<div class="p-info"><div class="p-nom">'+c[iN]+'</div>'+(dnext?'<div class="p-dist">'+dnext+'</div>':(c[iLAT]==null?'<div class="p-dist">Sin GPS — ubicar en campo</div>':''))+'</div>'+
      '<div class="p-acc">'+
        (maps?'<a class="ir" href="'+maps+'" target="_blank" rel="noopener" title="Navegar">🧭</a>':'')+
        '<button class="hh" title="Marcar visitado">'+(hecho?'✓':'○')+'</button>'+
      '</div></div>';
  });
  cont.innerHTML=html;
  cont.querySelectorAll('.parada').forEach(el=>{
    el.querySelector('.hh').onclick=()=>{const id=el.dataset.id;
      if(est.hechos.has(id))est.hechos.delete(id);else est.hechos.add(id);
      guardar();render();};
  });
}
function cid(c){return c[iSEQ]+'|'+c[iD]+'|'+c[iFR]+'|'+c[iN];}
let tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500);}
</script>
</body>
</html>
